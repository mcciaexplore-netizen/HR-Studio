# Full application: the Express service serves both the UI and /api.
# Paid service and disk. Review the estimate in DEPLOYMENT.md before creating.
services:
  - type: web
    name: mccia-hr-studio
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    numInstances: 1
    repo: https://github.com/mcciaexplore-netizen/HR-Studio
    branch: feat/mccia-msme-hr-studio
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:hosted
    healthCheckPath: /api/health
    disk:
      name: hrstudio-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /var/data/hrstudio.sqlite
      - key: COOKIE_SECURE
        value: "true"
      - key: REGISTRATION_OPEN
        value: "false"
      - key: DEMO_LOGIN_ENABLED
        value: "true"
      - key: DEMO_BOOTSTRAP
        value: "true"
